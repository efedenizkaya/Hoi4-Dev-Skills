name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run test suite
        run: python -m pytest -v
      - name: Install script smoke (POSIX)
        if: runner.os == 'Linux'
        run: bash tests/test_install.sh

  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Agent Skills reference validator (frontmatter conventions)
      - run: pipx install skills-ref || pip install skills-ref
      - name: Validate skill frontmatter
        run: |
          skills-ref validate skills/hoi4-modding 2>/dev/null \
            || python -c "print('skills-ref unavailable; structural lint covered by pytest')"
