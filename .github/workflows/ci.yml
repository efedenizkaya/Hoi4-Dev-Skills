name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # pull_request intentionally absent: this workflow runs on a self-hosted
  # runner. If the repo ever goes public, foreign PR code would execute on
  # the maintainer's machine.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs on the maintainer's self-hosted Windows runner: GitHub-hosted
# runners were blocked by an account billing flag (private repo), and the
# maintainer chose not to make the repo public. The machine has Python
# 3.14, pytest, skills-ref, Git Bash and PowerShell preinstalled.
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dev deps
        run: python -m pip install -r requirements-dev.txt "skills-ref==0.1.1"
        shell: bash
      - name: Run test suite
        run: python -m pytest -v
        shell: bash
      - name: Eval self-test (kits satisfy their gates)
        run: python tools/run_evals.py --evals evals/task-evals.json --self-test
        shell: bash
      - name: Install script smoke (POSIX)
        run: bash tests/test_install.sh
        shell: bash
      - name: Install script smoke (PowerShell)
        run: tests/test_install.ps1
        shell: powershell

  package:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Package the skill (.skill = zip of the skill dir)
        run: python -c "import shutil; shutil.make_archive('hoi4-modding', 'zip', 'skills', 'hoi4-modding')"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: hoi4-modding-skill
          path: hoi4-modding.zip

  skill-spec:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dev deps
        run: python -m pip install -r requirements-dev.txt "skills-ref==0.1.1"
        shell: bash
      - name: Validate skill frontmatter
        run: python -m skills_ref.cli validate skills/hoi4-modding
        shell: bash
