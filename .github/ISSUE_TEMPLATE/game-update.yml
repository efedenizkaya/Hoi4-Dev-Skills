name: Game update (claims drift)
description: A new HOI4 patch landed — claims need re-verification
labels: ["game-update"]
body:
  - type: input
    id: version
    attributes:
      label: Game version
      description: From the extractor output or launcher-settings.json rawVersion
      placeholder: "1.19.4.1"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Extractor summary
      description: Run `python tools/extract.py --summary-out summary.json` and paste the file. Counts only — never paste game content.
      render: json
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: What changed / broke?
      description: Skill advice that stopped working, validator oddities, error.log classes you saw
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include game-derived content or personal paths above
          required: true
