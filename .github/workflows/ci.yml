name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest
      - name: Run test suite
        run: python -m pytest -v
      - name: Install script smoke (POSIX)
        if: runner.os == 'Linux'
        run: bash tests/test_install.sh
      - name: Install script smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/test_install.ps1

  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Agent Skills reference validator (frontmatter conventions)
      - run: pip install skills-ref
      - name: Validate skill frontmatter
        run: python -m skills_ref.cli validate skills/hoi4-modding
